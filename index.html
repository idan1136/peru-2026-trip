        { day: 22, date: "5.10.26", origin: "לימה", stay_dest: "לימה", altitude: 0, alt_type: "low", alt_label: "פני הים", transit: "", attractions: ["קניות וסיור סיום בלימה."], lodging: "לינה בלימה" },
        { day: 23, date: "6.10.26", origin: "מדריד", stay_dest: "מדריד", altitude: 650, alt_type: "low", alt_label: "גובה נמוך", transit: "טיסה LY398 | המראה מלימה: 20:00, נחיתה במדריד: 14:20\nהמראה ממדריד: 22:50", attractions: ["קונקשן וסיור במדריד."], lodging: "טיסת לילה לישראל" },
        { day: 24, date: "7.10.26", origin: "מדריד", stay_dest: "תל אביב", altitude: 0, alt_type: "low", alt_label: "פני הים", transit: "נחיתה בתל אביב: 04:25", attractions: ["חזרה לישראל."], lodging: "הגעה הביתה" }
    ];

    let activeDayIndex = 0;

    function parseItinDate(str) {
        const [d, m, y] = str.split('.').map(Number);
        return new Date(2000 + y, m - 1, d);
    }

    function computeTodayIndex() {
        const first = parseItinDate(itinerary[0].date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffDays = Math.round((today - first) / 86400000);
        return Math.min(Math.max(diffDays, 0), itinerary.length - 1);
    }

    function renderSlider() {
        const container = document.getElementById('day-chips-container');
        container.innerHTML = '';
        itinerary.forEach((item, index) => {
            const chip = document.createElement('button');
            chip.className = `day-chip ${index === activeDayIndex ? 'active' : ''}`;
            chip.textContent = `יום ${item.day}`;
            chip.onclick = () => selectDay(index);
            container.appendChild(chip);
        });
    }

    // --- Link helpers: make hotel names, city names and flight numbers tappable ---
    function mapsUrl(query) {
        return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
    }
    function flightUrl(code) {
        return 'https://www.flightaware.com/live/flight/' + encodeURIComponent(code);
    }
    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function linkifyFlights(text) {
        const escaped = escapeHtml(text);
        return escaped.replace(/\b([A-Z]{2}\d{2,4})\b/g, (m) =>
            `<a class="inline-link" href="${flightUrl(m)}" target="_blank" rel="noopener">✈️ ${m}</a>`
        );
    }

    function selectDay(index) {
        activeDayIndex = index;
        renderSlider();
        const data = itinerary[index];
        document.getElementById('current-date').textContent = data.date;
        const destTitle = document.getElementById('dest-title');
        destTitle.textContent = data.stay_dest + ' 📍';
        destTitle.href = mapsUrl(data.stay_dest + ' פרו');
        const altBadge = document.getElementById('alt-badge');
        altBadge.textContent = `⛰️ ${data.altitude}m (${data.alt_label})`;
        altBadge.className = `altitude-badge alt-${data.alt_type}`;
        const alertBox = document.getElementById('alert-container');
        alertBox.innerHTML = data.alert ? `<div class="alert-box">${data.alert}</div>` : '';
        const transitSec = document.getElementById('transit-section');
        if (data.transit) {
            transitSec.style.display = 'block';
            document.getElementById('transit-text').innerHTML = linkifyFlights(data.transit);
        } else {
            transitSec.style.display = 'none';
        }
        const attrContainer = document.getElementById('attractions-container');
        attrContainer.innerHTML = '';
        if (data.attractions.length === 0) {
            attrContainer.innerHTML = '<div class="info-card"><div class="card-body">אין פעילויות מתוכננות / יום טיסה ונחיתה.</div></div>';
        } else {
            data.attractions.forEach((attr, i) => {
                const card = document.createElement('div');
                card.className = 'info-card';
                card.innerHTML = `<div class="card-title">פעילות ${i+1}</div><div class="card-body">${linkifyFlights(attr)}</div>`;
                attrContainer.appendChild(card);
            });
        }
        document.getElementById('stay-dest').textContent = `יעד לינה: ${data.stay_dest}`;
        const lodgingEl = document.getElementById('lodging-text');
        lodgingEl.innerHTML = '';
        if (data.lodging) {
            const lines = data.lodging.split('\n');
            const link = document.createElement('a');
            link.className = 'inline-link';
            link.target = '_blank';
            link.rel = 'noopener';
            link.href = mapsUrl(data.lodging.replace(/\n/g, ', '));
            link.textContent = lines[0] + ' 📍';
            lodgingEl.appendChild(link);
            if (lines.length > 1) {
                const rest = document.createElement('div');
                rest.className = 'lodging-rest';
                rest.textContent = lines.slice(1).join('\n');
                lodgingEl.appendChild(rest);
            }
        } else {
            lodgingEl.textContent = 'ללא מידע מפורט';
        }
    }
    renderSlider();
    selectDay(computeTodayIndex());

    const INFO_STORAGE_KEY = 'peru2026-key-info';
    const infoBtn = document.getElementById('info-btn');
    const infoModal = document.getElementById('info-modal');
    const infoClose = document.getElementById('info-close');
    const infoTextarea = document.getElementById('info-textarea');

    try {
        infoTextarea.value = localStorage.getItem(INFO_STORAGE_KEY) || '';
    } catch (e) { /* private browsing or storage unavailable */ }

    infoTextarea.addEventListener('input', () => {
        try {
            localStorage.setItem(INFO_STORAGE_KEY, infoTextarea.value);
        } catch (e) { /* private browsing or storage unavailable */ }
    });

    infoBtn.addEventListener('click', () => { infoModal.hidden = false; });
    infoClose.addEventListener('click', () => { infoModal.hidden = true; });
    infoModal.addEventListener('click', (e) => {
        if (e.target === infoModal) infoModal.hidden = true;
    });

    // --- Install-to-Home-Screen hint (iOS Safari only, when not already installed) ---
    (function () {
        const BANNER_DISMISS_KEY = 'peru2026-install-hint-dismissed';
        const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isStandalone = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;
        let dismissed = false;
        try { dismissed = localStorage.getItem(BANNER_DISMISS_KEY) === '1'; } catch (e) {}

        if (isIos && !isStandalone && !dismissed) {
            const banner = document.getElementById('install-banner');
            banner.hidden = false;
            document.getElementById('install-banner-close').addEventListener('click', () => {
                banner.hidden = true;
                try { localStorage.setItem(BANNER_DISMISS_KEY, '1'); } catch (e) {}
            });
        }
    })();

    // --- Register service worker so the app works fully offline once opened ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch((err) => {
                console.error('Service worker registration failed:', err);
            });
        });
    }
</script>
</body>
</html>
